  <!-- 配置Tailwind自定义主题 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF7D00', // 主色调：橙色（食欲、活力）
            secondary: '#FFB800', // 辅助色：亮黄色（快乐、美味）
            dark: '#1E1E2E', // 深色背景
            light: '#FAFAFA', // 浅色文本
            accent: '#FF4500', // 强调色：橙红色（热情）
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'spin-slow': 'spin 8s linear infinite',
            'roll': 'roll 0.1s linear infinite',
            'bounce-slow': 'bounce 2s infinite',
          },
          keyframes: {
            roll: {
              '0%': { transform: 'translateY(0)' },
              '100%': { transform: 'translateY(-100%)' },
            }
          }
        },
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }

        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }
      .glass-effect {
        backdrop-filter: blur(8px);
        background-color: rgba(255,255,255,0.1);
      }
      .slot-border {
        border-image: linear-gradient(to right, #FF7D00, #FFB800, #FF7D00) 1;
      }
      .lever-active {
        transform: rotate(30deg) translateY(10px);
      }
    }
  </style>
  
  <style>
    /* 基础样式 */
    body {
      background-image: radial-gradient(circle at center, #2D2D44 0%, #1E1E2E 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* 摇摇机滚筒样式 */
    .slot-reel {
      position: relative;
      overflow: hidden;
      height: 120px;
    }
    
    .slot-reel-inner {
      position: absolute;
      width: 100%;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    .slot-item {
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      text-align: center;
      padding: 0 5px;
    }
    
    .dish-price {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 4px;
      color: #FFB800;
    }
    
    /* 拉杆动画 */
    .lever {
      transition: all 0.3s ease;
      transform-origin: top center;
    }
    
    /* 中奖效果 */
    .win-effect {
      animation: win 0.5s ease infinite alternate;
    }
    
    @keyframes win {
      from { transform: scale(1); box-shadow: 0 0 20px rgba(255,125,0,0.5); }
      to { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,125,0,0.8); }
    }
    
    /* 粒子背景效果 */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      animation: float 8s infinite ease-in-out;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(180deg); }
    }
  </style>
</head>

      { name: "醋溜土豆丝", price: 15 }
    ];
    
    // DOM元素
    const lever = document.getElementById('lever');
    const spinBtn = document.getElementById('spin-btn');
    const addDishBtn = document.getElementById('add-dish-btn');
    const addDishModal = document.getElementById('add-dish-modal');
    const modalContent = document.getElementById('modal-content');
    const closeModal = document.getElementById('close-modal');
    const addDishForm = document.getElementById('add-dish-form');
    const dishNameInput = document.getElementById('dish-name');
    const dishPriceInput = document.getElementById('dish-price');
    const dishList = document.getElementById('dish-list');
    const result = document.getElementById('result');
    const winningDish = document.getElementById('winning-dish');
    const winningPrice = document.getElementById('winning-price');
    const particles = document.getElementById('particles');
    
    // 摇摇机滚筒元素
    const reels = [
      { element: document.getElementById('reel1-inner'), isSpinning: false },
      { element: document.getElementById('reel2-inner'), isSpinning: false },
      { element: document.getElementById('reel3-inner'), isSpinning: false }
    ];
    
    // 初始化菜品列表
    function initDishList() {
      dishList.innerHTML = '';
      dishes.forEach((dish, index) => {
        const dishTag = document.createElement('div');
        dishTag.className = 'bg-gray-800/70 hover:bg-gray-700/70 rounded-lg p-2 text-center cursor-pointer transition-all duration-300 transform hover:scale-105 flex flex-col items-center justify-center';
        dishTag.innerHTML = `
          <span class="text-sm md:text-base truncate">${dish.name}</span>
          <span class="text-xs text-secondary mt-1">${dish.price}元</span>
          <button class="mt-1 text-gray-400 hover:text-red-500 transition-colors self-end" onclick="removeDish(${index}, event)">
            <i class="fa fa-times text-xs"></i>
          </button>
        `;
        dishList.appendChild(dishTag);
      });
      
      // 更新美食数量显示
      const dishCountElement = document.querySelector('h2.text-primary span');
      if (dishCountElement) {
        dishCountElement.textContent = `（共${dishes.length}道美味）`;
      }
    }
    
    // 初始化摇摇机滚筒
    function initReels() {
      reels.forEach(reel => {
        reel.element.innerHTML = '';
        // 为每个滚筒添加双倍菜品，实现无缝滚动效果
        [...dishes, ...dishes].forEach(dish => {
          const item = document.createElement('div');
          item.className = 'slot-item text-[clamp(0.9rem,2vw,1.1rem)]';
          
          // 根据价格区间添加不同颜色
          let priceColor = 'text-green-400'; // 15元
          if (dish.price === 18) priceColor = 'text-secondary';
          if (dish.price === 20) priceColor = 'text-accent';
          if (dish.price === 25) priceColor = 'text-purple-500';
          
          item.classList.add(priceColor);
          
          item.innerHTML = `
            <span class="truncate">${dish.name}</span>
            <span class="dish-price">${dish.price}元</span>
          `;
          reel.element.appendChild(item);
        });
      });
    }
    
    // 摇动摇摇机
    function spinReels() {
      // 重置结果显示
      result.classList.add('hidden');
      result.classList.remove('win-effect');
      
      // 禁用按钮防止重复点击
      lever.style.pointerEvents = 'none';
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
      
      // 拉杆动画
      lever.classList.add('lever-active');
      
      // 随机选择中奖美食
      const winningIndex = Math.floor(Math.random() * dishes.length);
      const winningDishData = dishes[winningIndex];
      
      // 每个滚筒依次开始旋转
      reels.forEach((reel, index) => {
        reel.isSpinning = true;
        
        // 计算目标位置（确保中奖美食在中间）
        const itemHeight = 120;
        const targetPosition = (winningIndex * itemHeight) + (dishes.length * itemHeight);
        
        // 设置延迟，让滚筒依次停止
        setTimeout(() => {
          reel.element.style.transition = 'transform 3s cubic-bezier(0.2, 0.8, 0.2, 1)';
          reel.element.style.transform = `translateY(-${targetPosition}px)`;
          
          // 旋转结束
          setTimeout(() => {
            reel.isSpinning = false;
            
            // 所有滚筒都停止后
            if (!reels.some(r => r.isSpinning)) {
              lever.classList.remove('lever-active');
              lever.style.pointerEvents = 'auto';
              spinBtn.disabled = false;
              spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
              
              // 显示中奖结果
              winningDish.textContent = winningDishData.name;
              winningPrice.textContent = `价格：${winningDishData.price}元`;
              result.classList.remove('hidden');
              
              // 添加中奖动画
              setTimeout(() => {
                result.classList.add('win-effect');
                createConfetti();
              }, 300);
            }
          }, 3000);
        }, index * 500);
      });
    }
    
    // 添加美食
    function addDish(name, price) {
      const dishExists = dishes.some(dish => dish.name === name);
      
      if (name && price && !dishExists) {
        dishes.push({ name, price: parseInt(price) });
        initDishList();
        initReels();
        
        // 显示添加成功提示
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-all duration-500 transform translate-x-full';
        notification.textContent = `成功添加：${name}（${price}元）`;
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.classList.remove('translate-x-full');
        }, 100);
        
        setTimeout(() => {
          notification.classList.add('translate-x-full');
          setTimeout(() => {
            document.body.removeChild(notification);
          }, 500);
        }, 3000);
      } else if (dishExists) {
        alert('该美食已存在！');
      }
    }
    
    // 删除美食
    function removeDish(index, event) {
      event.stopPropagation();
      if (dishes.length > 3) { // 确保至少保留3个美食
        const removedDish = dishes.splice(index, 1)[0];
        initDishList();
        initReels();
        
        // 显示删除提示
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-all duration-500 transform translate-x-full';
        notification.textContent = `已删除：${removedDish.name}（${removedDish.price}元）`;
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.classList.remove('translate-x-full');
        }, 100);
        
        setTimeout(() => {
          notification.classList.add('translate-x-full');
          setTimeout(() => {
            document.body.removeChild(notification);
          }, 500);
        }, 3000);
      } else {
        alert('至少保留3道美食才能继续使用！');
      }
    }
    
    // 创建粒子背景
    function createParticles() {
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // 随机大小、位置和动画延迟
        const size = Math.random() * 10 + 2;
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const delay = Math.random() * 10;
        const duration = Math.random() * 10 + 5;
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${x}%`;
        particle.style.top = `${y}%`;
        particle.style.animationDelay = `${delay}s`;
        particle.style.animationDuration = `${duration}s`;
        
        particles.appendChild(particle);
      }
    }
    
    // 创建庆祝彩屑
    function createConfetti() {
      const colors = ['#FF7D00', '#FFB800', '#FF4500', '#FFFFFF', '#FF6B6B', '#4ECDC4', '#A855F7'];
      
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'fixed z-40';
        
        // 随机样式
        const size = Math.random() * 10 + 5;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const x = Math.random() * 100;
        const rotation = Math.random() * 360;
        const duration = Math.random() * 3 + 2;
        
        confetti.style.width = `${size}px`;
        confetti.style.height = `${size / 2}px`;
        confetti.style.backgroundColor = color;
        confetti.style.left = `${x}%`;
        confetti.style.top = '-20px';
        confetti.style.transform = `rotate(${rotation}deg)`;
        confetti.style.opacity = '0.8';
        confetti.style.borderRadius = '3px';
        confetti.style.animation = `fall ${duration}s linear forwards`;
        
        document.body.appendChild(confetti);
        
        // 动画结束后移除
        setTimeout(() => {
          document.body.removeChild(confetti);
        }, duration * 1000);
      }
      
      // 添加下落动画
      const style = document.createElement('style');
      style.textContent = `
        @keyframes fall {
          0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
          100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
      
      // 移除样式
      setTimeout(() => {
        document.head.removeChild(style);
      }, 5000);
    }
    
    // 事件监听
    function initEventListeners() {
      // 拉杆点击
      lever.addEventListener('click', spinReels);
      
      // 摇动按钮
      spinBtn.addEventListener('click', spinReels);
      
      // 添加美食按钮
      addDishBtn.addEventListener('click', () => {
        addDishModal.classList.remove('hidden');
        setTimeout(() => {
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
        dishNameInput.focus();
      });
      
      // 关闭模态框
      closeModal.addEventListener('click', () => {
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          addDishModal.classList.add('hidden');
        }, 300);
      });
      
      // 点击模态框背景关闭
      addDishModal.addEventListener('click', (e) => {
        if (e.target === addDishModal) {
          closeModal.click();
        }
      });
      
      // 表单提交
      addDishForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const dishName = dishNameInput.value.trim();
        const dishPrice = dishPriceInput.value.trim();
        
        if (dishName && dishPrice) {
          addDish(dishName, dishPrice);
          dishNameInput.value = '';
          dishPriceInput.value = '';
          closeModal.click();
        }
      });
      
      // 键盘事件
      document.addEventListener('keydown', (e) => {
        // 按空格键摇动
        if (e.code === 'Space' && !reels.some(r => r.isSpinning)) {
          spinReels();
        }
        
        // 按ESC关闭模态框
        if (e.code === 'Escape' && !addDishModal.classList.contains('hidden')) {
          closeModal.click();
        }
      });
    }
    
    // 初始化
    function init() {
      createParticles();
      initDishList();
      initReels();
      initEventListeners();
    }
    
    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
